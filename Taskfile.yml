# https://taskfile.dev
version: '3'
vars:
  BINFILE: s3xplorer
  BULMA_VERSION: 1.0.4

tasks:
  default:
    desc: "List all tasks"
    cmds:
      - task -a

  css:vendor:
    desc: "Re-vendor the Bulma stylesheet (committed; only needed to upgrade)"
    silent: true
    cmds:
      - curl -sSfL -o pkg/views/static/bulma.min.css https://cdn.jsdelivr.net/npm/bulma@{{.BULMA_VERSION}}/css/bulma.min.css
      - task: css:compress
      - shasum -a 256 pkg/views/static/bulma.min.css

  css:compress:
    desc: "Regenerate the pre-compressed .gz siblings served to gzip clients"
    silent: true
    sources:
      - pkg/views/static/bulma.min.css
      - pkg/views/static/theme.css
    generates:
      - pkg/views/static/bulma.min.css.gz
      - pkg/views/static/theme.css.gz
    cmds:
      - gzip -9 -k -f -n pkg/views/static/bulma.min.css
      - gzip -9 -k -f -n pkg/views/static/theme.css

  build:
    desc: "Build the binary"
    deps:
      - css:compress
    cmds:
      - go mod download
      - go generate ./...
      - CGO_ENABLED=0 go build .

  lint:
    desc: "Run linter"
    cmds:
      - go generate ./...
      - golangci-lint run

  vulncheck:
    desc: "Scan dependencies for known vulnerabilities"
    cmds:
      - govulncheck ./...

  minio:
    desc: "Launch minio server"
    dir: conf-examples
    cmds:
      - docker compose up -d

  run:
    desc: "Run the binary with minio server"
    deps: 
    - minio
    cmds:
      - go generate ./...
      - go run . -f conf-examples/config-minio.yaml

  image:
    desc: "Build docker image"
    deps: 
    - snapshot
    cmds:
      - docker push ghcr.io/sgaunet/s3xplorer:latest-amd64
      - docker tag  ghcr.io/sgaunet/s3xplorer:latest-amd64 ghcr.io/sgaunet/s3xplorer:latest
      - docker push ghcr.io/sgaunet/s3xplorer:latest

  snapshot:
    desc: "Create a snapshot release"
    cmds:
      - GITLAB_TOKEN="" goreleaser --clean --snapshot

  release:
    desc: "Create a release"
    cmds:
      - GITLAB_TOKEN="" goreleaser --clean

    